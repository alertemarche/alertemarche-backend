services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alertemarche_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis
    networks:
      - alertemarche

  nginx:
    image: nginx:alpine
    container_name: alertemarche_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - alertemarche

  postgres:
    image: postgres:15-alpine
    container_name: alertemarche_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-alertemarche}
      POSTGRES_USER: ${DB_USERNAME:-alertemarche}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - alertemarche

  redis:
    image: redis:7-alpine
    container_name: alertemarche_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - alertemarche

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alertemarche_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
      - postgres
    networks:
      - alertemarche

volumes:
  pgdata:

networks:
  alertemarche:
    driver: bridge
